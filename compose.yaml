# Environnement de développement. Le nom du projet Compose vient du dossier : chaque worktree a ses
# propres conteneurs. Ports publiés surchargeables pour en faire tourner plusieurs en parallèle :
# HTTP_PORT, MERCURE_PORT, MAILPIT_PORT (environnement ou compose.override.yaml).

services:
  php:
    build:
      context: .
      target: dev
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      - ./:/app
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.31-alpine
    ports:
      - ${HTTP_PORT:-8100}:80
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: '!ChangeMe!'
    ports:
      # Port hôte aléatoire : docker compose port database 5432
      - '5432'
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -d, app, -U, app]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  mercure:
    image: dunglas/mercure:v1
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_EXTRA_DIRECTIVES: cors_origins http://localhost:${HTTP_PORT:-8100}
    ports:
      - ${MERCURE_PORT:-3100}:80
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  mailer:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - ${MAILPIT_PORT:-8125}:8025

volumes:
  database_data:
  mercure_data:
  mercure_config:
