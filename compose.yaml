# Environnement de développement. Le nom du projet Compose vient du dossier : chaque worktree a ses
# propres conteneurs. Ports publiés surchargeables pour en faire tourner plusieurs en parallèle :
# HTTP_PORT, MERCURE_PORT, MAILPIT_PORT (environnement ou compose.override.yaml).

# Configuration commune au serveur PHP-FPM et au worker Messenger
x-php: &php
  build:
    context: .
    target: dev
  user: ${UID:-1000}:${GID:-1000}
  volumes:
    - ./:/app
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
    # URL publiques dérivées des ports publiés (priment sur .env)
    DEFAULT_URI: http://localhost:${HTTP_PORT:-8100}
    MERCURE_PUBLIC_URL: http://localhost:${MERCURE_PORT:-3100}/.well-known/mercure
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  php:
    <<: *php

  # Traite la file asynchrone (e-mails, puis événements de jeu). Redémarré toutes les heures pour
  # recharger le code ; après une modification du code : docker compose restart worker.
  # Sans le mode débogage, comme en production : en dev, Doctrine conserverait la trace de chaque requête
  # et une génération de galaxie (≈ 10 000 insertions) dépasserait la limite mémoire.
  worker:
    <<: *php
    command: [bin/console, messenger:consume, async, --time-limit=3600, --memory-limit=256M, --no-debug]
    restart: unless-stopped

  web:
    image: nginx:1.31-alpine
    ports:
      - ${HTTP_PORT:-8100}:80
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: '!ChangeMe!'
    ports:
      # Port hôte aléatoire : docker compose port database 5432
      - '5432'
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -d, app, -U, app]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  mercure:
    image: dunglas/mercure:v1
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?défini dans .env}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?défini dans .env}
      MERCURE_TRUSTED_ISSUERS: ${MERCURE_JWT_ISSUER:-http://localhost:8100}
      # resource_identifier = URL publique : audience unique pour la publication interne et l'abonnement
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:${HTTP_PORT:-8100}
        resource_identifier http://localhost:${MERCURE_PORT:-3100}/.well-known/mercure
    ports:
      - ${MERCURE_PORT:-3100}:80
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  mailer:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - ${MAILPIT_PORT:-8125}:8025

volumes:
  database_data:
  mercure_data:
  mercure_config:
