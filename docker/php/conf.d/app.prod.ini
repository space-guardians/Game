; Production : le code ne change pas dans l'image, OPcache ne revalide jamais les fichiers
opcache.validate_timestamps = 0
; Classes du conteneur Symfony préchargées au démarrage de PHP-FPM
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data

; Erreurs dans les journaux (stderr du conteneur), jamais dans les pages
display_errors = 0
log_errors = 1
