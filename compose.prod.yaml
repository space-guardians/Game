# Préproduction et production (docs/exploitation.md). Un environnement = un dossier sur le serveur avec ce fichier,
# le dossier docker/ et son .env.server (secrets, copié de .env.server.dist, jamais versionné) :
#   docker compose -f compose.prod.yaml --env-file .env.server -p space-guardians-prod up -d --build
# Les images se construisent sur place (--build) ou se tirent d'un registre (IMAGE_PREFIX, IMAGE_TAG ; #93).

# Configuration commune aux conteneurs PHP : image de production, variables d'environnement du serveur
x-app: &app
  image: ${IMAGE_PREFIX:-space-guardians}/php:${IMAGE_TAG:-latest}
  build:
    context: .
    target: prod
  env_file: .env.server
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  # Migrations Doctrine, une fois à chaque déploiement, avant le démarrage du code qui en dépend
  migrate:
    <<: *app
    command: [bin/console, doctrine:migrations:migrate, --no-interaction, --allow-no-migration, --all-or-nothing]
    restart: 'no'
    depends_on:
      database:
        condition: service_healthy

  php:
    <<: *app

  # Événements de jeu, e-mails et tâches récurrentes ; redémarré toutes les heures (fuites mémoire, nouveau code)
  worker:
    <<: *app
    command: [bin/console, messenger:consume, async, scheduler_default, --time-limit=3600, --memory-limit=256M]

  web:
    image: ${IMAGE_PREFIX:-space-guardians}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    # Derrière le proxy TLS de l'hébergement : HTTP seulement, sur ce port
    ports:
      - ${HTTP_PORT:-8080}:80
    depends_on:
      - php
    # Sonde de santé de l'application (HealthController) : base, Redis, worker
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/sante]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  database:
    image: postgres:18-alpine
    env_file: .env.server
    restart: unless-stopped
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Verrous, cache, sessions, chat : persisté (AOF) pour qu'un redémarrage ne déconnecte pas les joueurs
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  mercure:
    image: dunglas/mercure:v1
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?défini dans .env.server}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?défini dans .env.server}
      MERCURE_TRUSTED_ISSUERS: ${MERCURE_JWT_ISSUER:?défini dans .env.server}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${DEFAULT_URI:?défini dans .env.server}
        resource_identifier ${MERCURE_PUBLIC_URL:?défini dans .env.server}
        cookie_name ${MERCURE_COOKIE_NAME:-__Secure-mercure_access_token}
    ports:
      - ${MERCURE_PORT:-8081}:80
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  # Sauvegarde quotidienne de la base (pg_dump), gardée BACKUP_RETENTION_DAYS jours dans le volume « backups »
  backup:
    image: postgres:18-alpine
    env_file: .env.server
    restart: unless-stopped
    entrypoint: [/bin/sh, /backup/backup.sh]
    volumes:
      - ./docker/backup:/backup:ro
      - backups:/backups
    # Après les migrations : la sauvegarde du démarrage porte sur le schéma à jour
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  database_data:
  redis_data:
  mercure_data:
  mercure_config:
  backups:
