framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Génération de galaxie depuis le panneau d'administration (traitement long)
            App\Message\GenerateGalaxy: async
            # Réveils différés des événements planifiés (§5.2)
            App\Message\ResolveScheduledEvent: async

when@test:
    framework:
        messenger:
            transports:
                # Les tests inspectent les messages (e-mails compris) sans worker
                async: 'in-memory://'
