security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Rôles d'administration (§5.6.2) : chacun hérite des droits du précédent
    role_hierarchy:
        ROLE_GAME_DESIGNER: ROLE_MODERATOR
        ROLE_ADMIN: ROLE_GAME_DESIGNER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    providers:
        # Chargement par loadUserByIdentifier() des repositories, qui normalise l'adresse e-mail
        players:
            entity:
                class: App\Entity\User
        admins:
            entity:
                class: App\Entity\AdminUser

    firewalls:
        dev:
            # Outils de développement et ressources statiques toujours accessibles
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Panneau d'administration : comptes et session distincts de ceux des joueurs (§5.6.2)
        admin:
            pattern: ^/admin
            lazy: true
            provider: admins
            form_login:
                login_path: admin_login
                check_path: admin_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: admin
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            # Code TOTP demandé après le mot de passe (comptes ayant activé la double authentification)
            two_factor:
                auth_form_path: admin_2fa_login
                check_path: admin_2fa_check
                default_target_path: admin
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login
        # Joueurs
        main:
            lazy: true
            provider: players
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_home
            # 5 tentatives par compte et par IP sur 15 minutes, puis blocage temporaire
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                signature_properties: ['password']
            logout:
                path: app_logout
                target: app_login

    # Seule la première règle qui correspond s'applique
    access_control:
        - { path: ^/admin/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/deconnexion$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/double-authentification(/verification)?$, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_MODERATOR }
        - { path: ^/(connexion|inscription|mot-de-passe-oublie), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Coût minimal en test : le hachage est volontairement lent
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
