security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Chargement par UserRepository::loadUserByIdentifier(), qui normalise l'adresse e-mail
        players:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Outils de développement et ressources statiques toujours accessibles
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Joueurs. La zone /admin aura son propre pare-feu et ses propres comptes (§5.6.2, #104).
        main:
            lazy: true
            provider: players
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_home
            # 5 tentatives par compte et par IP sur 15 minutes, puis blocage temporaire
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                signature_properties: ['password']
            logout:
                path: app_logout
                target: app_login

    # Seule la première règle qui correspond s'applique
    access_control:
        - { path: ^/(connexion|inscription|mot-de-passe-oublie), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Coût minimal en test : le hachage est volontairement lent
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
