framework:
    cache:
        # Cache applicatif partagé entre les conteneurs web et le worker (§5.2) : compteurs des limiteurs de débit
        # (connexion, chat, actions sensibles), caches de résultats Doctrine… Un cache de fichiers serait propre à
        # chaque conteneur, et chaque limiteur compterait à part.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            # Tests : cache de fichiers (var/cache/test) ; les compteurs ne survivent pas dans Redis d'une exécution à
            # l'autre
            app: cache.adapter.filesystem
