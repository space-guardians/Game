mercure:
    hubs:
        default:
            # URL interne (publication par le serveur) et URL publique (abonnement du navigateur)
            url: '%env(MERCURE_URL)%'
            public_url: '%env(MERCURE_PUBLIC_URL)%'
            # Hub Mercure v1 : JWT au format RFC 9068 (iss, sub, client_id, aud, exp)
            protocol_version: '1.0'
            # Cookie d'autorisation des abonnements privés : le nom par défaut du protocole 1.0
            # (« __Secure-mercure_access_token ») exige HTTPS ; le même nom est configuré côté hub (compose.yaml)
            cookie_name: '%env(MERCURE_COOKIE_NAME)%'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
                claims:
                    # Doit figurer dans MERCURE_TRUSTED_ISSUERS côté hub
                    iss: '%env(MERCURE_JWT_ISSUER)%'
                    sub: space-guardians
                    client_id: space-guardians
                    # « aud » vaut public_url par défaut : le hub épingle ce même resource_identifier
