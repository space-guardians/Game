# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Déconnexion du panneau d'administration après 30 minutes sans activité (§5.6.2)
    app.admin_idle_timeout: 1800

    # Économie (§4.2) : production naturelle d'une planète habitée, en plus des mines ; reprises d'OGame, à équilibrer (§7).
    # Coûts et effets des bâtiments : types de bâtiments, réglables dans le panneau (/admin/batiments).
    app.economy.base_hourly_production: { metal: 30, crystal: 15, deuterium: 0 }
    app.economy.starting_resources: { metal: 500, crystal: 500, deuterium: 0 }
    # Bonus des mines selon l'orbite (§2.2) : métal sur les orbites centrales, cristal près de l'étoile
    app.economy.orbit_bonuses:
        metal: { 6: 0.17, 7: 0.23, 8: 0.35, 9: 0.23, 10: 0.17 }
        crystal: { 1: 0.4, 2: 0.3, 3: 0.2 }
    app.economy.universe_speed: 1.0

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Model\Economy\EconomySettings:
        arguments:
            $baseHourlyProduction: '%app.economy.base_hourly_production%'
            $orbitBonuses: '%app.economy.orbit_bonuses%'
            $startingResources: '%app.economy.starting_resources%'
            $universeSpeed: '%app.economy.universe_speed%'

    # Aléatoire non reproductible (graines de génération…) : moteur sûr par défaut
    Random\Randomizer: ~

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Moteur de combat : branché aux batailles programmées avec #45 ; d'ici là, retiré du conteneur faute d'usage
        App\Service\Combat\CombatEngine:
            public: true
        App\Service\Combat\CombatGroups:
            public: true
        App\Service\Combat\CombatMotions:
            public: true

        # Doublures de test : gestionnaires d'événements planifiés factices, publications Mercure enregistrées
        App\Tests\Fixtures\:
            resource: '../tests/Fixtures/'

        # MockHub partout ; seul MercureHubTest vise le vrai hub (service « mercure.hub.default »)
        Symfony\Component\Mercure\HubInterface:
            class: Symfony\Component\Mercure\MockHub
            arguments:
                $url: 'https://mercure.test/.well-known/mercure'
                $jwtProvider: !service
                    class: Symfony\Component\Mercure\Jwt\StaticTokenProvider
                    arguments: ['jeton-de-test']
                $publisher: '@App\Tests\Fixtures\Mercure\PublishedUpdates'

        # Graine fixe : les tests sont reproductibles
        Random\Randomizer:
            arguments: ['@app.test_random_engine']
        app.test_random_engine:
            class: Random\Engine\Mt19937
            arguments: [42]
